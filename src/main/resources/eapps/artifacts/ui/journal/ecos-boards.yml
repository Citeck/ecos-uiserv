---
id: ecos-boards
name:
  ru: Канбан-доски
  en: Kanban boards

system: true

actions:
  - uiserv/action@view-dashboard
  - uiserv/action@download-base64-data-yml
  - uiserv/action@delete
  - uiserv/action@edit
  - uiserv/action@edit-json
  - uiserv/action@module-copy

columns:

  - id: id
    name: { ru: Идентификатор, en: Id }
    type: TEXT

  - id: name
    name: { ru: Название, en: Name }
    type: TEXT

  - id: workspaceRef
    name:
      ru: Рабочее пространство
      en: Workspace
    type: ASSOC
    editor:
      type: journal
      config:
        journalId: "workspaces-journal"
    sortable: false
    editable: false

  - id: journalRef
    name: { ru: Журнал, en: Journal }
