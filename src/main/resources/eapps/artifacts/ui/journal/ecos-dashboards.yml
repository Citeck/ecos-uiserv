---
id: ecos-dashboards
name:
  ru: Дашборды
  en: Dashboards

properties: {upd: true}

system: true

actions:
  - uiserv/action@download-base64-data-json
  - uiserv/action@delete
  - uiserv/action@edit
  - uiserv/action@edit-json
  - uiserv/action@module-copy

columns:

  - id: moduleId
    name: { ru: Идентификатор, en: Id }
    type: TEXT

  - id: typeRef
    name: { ru: Тип ECOS, en: ECOS Type }
    searchable: false

  - id: appliedToRef
    name: { ru: Запись, en: Record }
    searchable: false

  - id: authority
    name: { ru: Пользователь или группа, en: User or group }

  - id: workspaceRef
    name:
      ru: Рабочее пространство
      en: Workspace
    type: ASSOC
    editor:
      type: journal
      config:
        journalId: "workspaces-journal"
    sortable: false
    editable: false

  - id: _created
    name:
      ru: Дата создания
      en: Created
    type: DATETIME

  - id: _modified
    name:
      ru: Дата изменения
      en: Modified
    type: DATETIME

  - id: _creator
    name:
      ru: Создатель
      en: Creator
    hidden: true

  - id: _modifier
    name:
      ru: Изменил
      en: Modified by
    hidden: true
