---
id: ui-actions
name:
  ru: Действия
  en: Actions

properties: {upd: true}

system: true

actions:
  - uiserv/action@edit
  - uiserv/action@download-base64-data-yml
  - uiserv/action@delete
  - uiserv/action@edit-json
  - uiserv/action@module-copy

columns:

  - id: moduleId
    name: { ru: Идентификатор, en: Id }
    type: TEXT

  - id: name
    name: { ru: Имя, en: Name }
    type: TEXT

  - id: workspaceRef
    name:
      ru: Рабочее пространство
      en: Workspace
    type: ASSOC
    editor:
      type: journal
      config:
        journalId: "workspaces-journal"
    sortable: false
    editable: false

  - id: type
    name: { ru: Тип, en: Type }
